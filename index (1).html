function usr(){var A=window.ADMS,R=['Admin','Branch User'].concat(A.roles,['Department Head','Department User','Director']),h='<div class="card"><h2>Create user</h2><p>Choose the role, then the region. The branch list shows only the branches of that region. A Branch User or Branch Head can have one or more branches. An RM can be mapped to several branches of the region; if no branch is selected, the RM covers the whole region. A new user must change the temporary password at the first login.</p>';

 h+='<div class="card"><h2>Users ('+U.users.length+')</h2><div class="wrap"><table><tr><th>Name</th><th>Username</th><th>Role</th><th>Scope</th><th>Status</th><th></th></tr>'+U.users.map(function(u,i){var bl=u.branches||[];return'<tr><td>'+esc(u.name)+'</td><td>'+esc(u.user)+'</td><td>'+esc(u.role)+'</td><td>'+esc(bl.length?(u.region?u.region+': ':'')+bl.join(', '):(u.region||u.dept||'All'))+'</td><td>'+(u.locked?'<span class="bad">Locked</span>':u.mc?'Must change password':'Active')+'</td><td><button class="ghost" data-u="urs" data-i="'+i+'">Reset password</button> '+(u.locked?'<button class="ghost" data-u="unl" data-i="'+i+'">Unlock</button> ':'')+(u.user===cu.user?'':'<button class="ghost" data-u="udel" data-i="'+i+'">Delete</button>')+'</td></tr>'}).join('')+'</table></div></div>';
 h+='<div class="card"><h2>Import users from Excel</h2><p>Columns: Full name, Username, Password, Role, Region, Branch, Department. For Branch User and Branch Head fill Region and one or more Branches (separate several with commas). For RM fill Region, and Branches if the RM covers only some branches. For Department Head and Department User fill Department. Imported users must change the password at the first login. Rows with errors are skipped.</p><div class="row"><input type="file" id="uf" accept=".xlsx,.xls,.csv"><button class="btn" data-u="uimp">Import users</button></div><div id="ures"></div></div><div class="card"><h2>Test data</h2><p>Remove all test requests and start again. Users and setup are kept.</p><button class="ghost" data-u="clr">Clear all requests</button></div>';

document.body.addEventListener('click',async function(e){var b=e.target.closest('[data-u]');if(!b||b.tagName==='SELECT'||b.tagName==='INPUT')return;var a=b.dataset.u;if(a==='login'||a==='uadd'||a==='udel'||a==='cpw'||a==='urs'||a==='unl'){var xu=await aget('users');if(xu&&xu.users)U=xu}
 if(a==='login'){var un=val('lu').toLowerCase(),pw=document.getElementById('lp').value.trim(),u=U.users.filter(function(x){return x.user===un})[0],er=function(m){document.getElementById('lerr').textContent=m};
  if(!u){er(SERVER?'Invalid username or password.':'Invalid username or password. Users are saved only in the browser where they were created.');return}
  if(u.locked){er('This account is locked after too many wrong passwords. Please contact your Admin to unlock it.');return}
  if(u.pw!==pw){u.fails=(u.fails||0)+1;if(u.fails>=5){u.locked=true;er('The account is locked after 5 wrong attempts. Please contact your Admin.')}else er('Invalid username or password. '+(5-u.fails)+' attempt(s) left.');sv();return}
  if(u.fails){u.fails=0;sv()}
  if(u.mc||u.pw==='admin123'){chg(u);return}
  enter(u)}
 else if(a==='tp'){var pe=document.getElementById('lp');pe.type=pe.type==='password'?'text':'password';b.textContent=pe.type==='password'?'Show':'Hide'}
 else if(a==='forgot')document.getElementById('lnote').textContent='Please contact your Admin. The Admin can reset your password from the Users tab.'
 else if(a==='cpw'){var p1=document.getElementById('np1').value.trim(),p2=document.getElementById('np2').value.trim(),e2=function(m){document.getElementById('lerr').textContent=m},uu=U.users.filter(function(x){return x.user===pend.user})[0];
  if(!uu)return;if(p1.length<6){e2('The password must have at least 6 characters.');return}if(p1!==p2){e2('The two passwords are not the same.');return}if(p1===uu.pw||p1==='admin123'){e2('Choose a different password from the old one.');return}
  uu.pw=p1;uu.mc=false;sv();pend=null;enter(uu)}
 else if(a==='urs'){var ur=U.users[+b.dataset.i],tp=prompt('Enter a new temporary password for '+ur.name+' (at least 6 characters):');if(!tp||tp.length<6)return;ur.pw=tp;ur.mc=true;ur.locked=false;ur.fails=0;sv();usr()}
 else if(a==='unl'){var ul=U.users[+b.dataset.i];ul.locked=false;ul.fails=0;sv();usr()}
 else if(a==='logout'){cu=null;window.CUR=null;try{sessionStorage.removeItem('bap-sess')}catch(e){}document.getElementById('shell').style.display='none';document.getElementById('login').style.display='';lg()}
 else if(a==='tab')show(b.dataset.k)
 else if(a==='uadd'){var nm=val('fn'),un2=val('un').toLowerCase(),pw2=val('pw'),ro=val('rl'),rg=val('rg'),dp=val('dp'),brs=[].slice.call(document.getElementById('br').selectedOptions).map(function(o){return o.value}),bo=ro==='Branch User'||ro==='Branch Head',dr=ro==='Department Head'||ro==='Department User';
  if(!nm||!un2||!pw2){alert('Enter the full name, username and temporary password.');return}
  if(pw2.length<6){alert('The temporary password must have at least 6 characters.');return}
  if(U.users.some(function(x){return x.user===un2})){alert('This username is already used.');return}
  if(U.users.some(function(x){return x.name===nm})){alert('This name is already used. Use a different full name.');return}
  if((bo||ro==='RM')&&!rg){alert('Choose the region.');return}if(bo&&!brs.length){alert('Choose at least one branch.');return}if(dr&&!dp){alert('Choose the department.');return}
  U.users.push({name:nm,user:un2,pw:pw2,role:ro,region:(bo||ro==='RM')?rg:'',branches:(bo||ro==='RM')?brs:[],dept:dr?dp:'',mc:true});sv();usr()}
 else if(a==='udel'){var x=U.users[+b.dataset.i];if(!confirm('Delete user "'+x.name+'"?'))return;U.users.splice(+b.dataset.i,1);sv();usr()}
 else if(a==='uimp'){var f=document.getElementById('uf').files[0];if(!f){alert('Choose an Excel file first.');return}if(typeof XLSX==='undefined'){alert('The Excel reader could not load. Check the internet connection and reload the page.');return}
  var wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}),A=window.ADMS,RL=['Admin','Branch User'].concat(A.roles,['Department Head','Department User','Director']),ok=0,bad=[];
  var g=function(o,keys){for(var k in o){if(keys.indexOf(k.toLowerCase().replace(/[^a-z]/g,''))>-1)return String(o[k]).trim()}return ''};
  var fm=function(list,x){return list.filter(function(y){return y.toLowerCase()===x.toLowerCase()})[0]||''};
  rows.forEach(function(o,i){var nm=g(o,['fullname','name']),un=g(o,['username','user']).toLowerCase(),pw=g(o,['password']),ro=fm(RL,g(o,['role'])),br=g(o,['branch']),rg=g(o,['region']),dp=g(o,['department','dept']),err='';
   if(!nm&&!un&&!pw)return;
   if(!nm||!un||!pw)err='name, username or password is missing';
   else if(!ro)err='role not recognised';
   else if(U.users.some(function(x){return x.user===un}))err='username already used';
   else if(U.users.some(function(x){return x.name===nm}))err='name already used';
   else if(pw.length<6)err='password must have at least 6 characters';
   else{var bo=ro==='Branch User'||ro==='Branch Head',dr=ro==='Department Head'||ro==='Department User',bl=[],rgm='';
    if(bo||ro==='RM'){rgm=rg?fm(A.regions,rg):'';
     if(rg&&!rgm)err='region not found in Setup';
     else{bl=br.split(/[,;]/).map(function(x){return x.trim()}).filter(Boolean).map(function(x){return fm(A.branches.map(function(b){return b.n}),x)});
      if(bl.some(function(x){return !x}))err='a branch was not found in Setup';
      else if(bo&&!bl.length)err='branch is missing';
      else if(ro==='RM'&&!rgm&&!bl.length)err='region or branches are missing';
      else{var rb=bl.map(function(n){return A.branches.filter(function(b){return b.n===n})[0].r});rgm=rgm||rb[0]||'';if(rb.some(function(x){return x!==rgm}))err='the branches must all be in the region '+rgm}}}
    else if(dr){dp=fm(A.depts,dp);if(!dp)err='department not found in Setup'}
    if(!err){U.users.push({name:nm,user:un,pw:pw,role:ro,region:(bo||ro==='RM')?rgm:'',branches:(bo||ro==='RM')?bl:[],dept:dr?dp:'',mc:true});ok++}}
   if(err)bad.push('Row '+(i+2)+': '+err)});
  if(ok)sv();usr();
  document.getElementById('ures').innerHTML='<p><strong>'+ok+' users imported.</strong> '+bad.length+' rows skipped.</p>'+(bad.length?'<ul>'+bad.slice(0,30).map(function(x){return'<li>'+esc(x)+'</li>'}).join('')+'</ul>':'')}
 else if(a==='bimp'){var f2=document.getElementById('bf').files[0];if(!f2){alert('Choose an Excel file first.');return}if(typeof XLSX==='undefined'){alert('The Excel reader could not load. Check the internet connection and reload the page.');return}
  var wb2=XLSX.read(await f2.arrayBuffer(),{type:'array'}),A2=window.ADMS,added=0,newR=0,skip=0;

   rows.some(function(r,i){var c=r.map(function(x){return String(x).trim().toLowerCase()});if(c.indexOf('branch')>-1){hi=i;bc=c.indexOf('branch');rc=c.indexOf('region');return true}return false});
   rows.slice(hi+1).forEach(function(r){var name=tc(r[bc]||''),reg=rc>-1?tc(r[rc]||''):tc(sn);if(!name||!reg)return;
    var er=fm2(A2.regions,reg);if(!er){A2.regions.push(reg);er=reg;newR++}
    if(A2.branches.some(function(b){return b.n.toLowerCase()===name.toLowerCase()})){skip++;return}
    A2.branches.push({n:name,r:er});added++})});
  if(added||newR)window.ADSAVE();window.ADRAW();bri();
  document.getElementById('bres').innerHTML='<p><strong>'+added+' branches added</strong>, '+newR+' new regions, '+skip+' branches skipped because they already exist.</p>'}
 else if(a==='clr'){if(confirm('Delete all requests?'))window.REQ.clear()}});
